<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Ganado</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#2f6f3e">
<style>
:root{--bg:#f6f4ef;--card:#fff;--fg:#222;--mut:#666;--line:#ddd;--acc:#2f6f3e;--warn:#b5651d;--bad:#a33}
@media (prefers-color-scheme:dark){:root{--bg:#161815;--card:#22251f;--fg:#eee;--mut:#9a9a9a;--line:#3a3d36;--acc:#6fbf7f;--warn:#e0a060;--bad:#e07070}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:19px/1.45 system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#2f6f3e;color:#fff}
header h1{font-size:1.3rem;margin:0;flex:1}
main{max-width:760px;margin:auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:52px}
button.grande{display:block;width:100%;text-align:left;font-size:1.15em;font-weight:600;margin:10px 0;padding:18px}
table{border-collapse:collapse;width:100%;margin:6px 0}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
#reporte h2{font-size:1.25rem}
#reporte{overflow-x:auto}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#000;font-size:12pt}#reporte{border:0}main{max-width:none;padding:0}}
button{cursor:pointer}
button.pri{background:#2f6f3e;color:#fff;border:0}
header button{background:#ffffff22;color:#fff;border:1px solid #ffffff55}
input,select,textarea{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.item{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.mut{color:var(--mut);font-size:.9em}
.tag{font-size:.8em;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.warn{color:var(--warn)}.bad{color:var(--bad)}
label{display:block;font-size:.9em;color:var(--mut);margin-top:6px}
h2{font-size:1.1rem;margin:16px 0 4px}
ul{list-style:none;padding:0;margin:0}
li.ev{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>🐄 Registro de Ganado</h1>
  <button id="bExp">Exportar respaldo</button>
  <button id="bImp">Importar respaldo</button>
  <input id="fImp" type="file" accept=".json,application/json" class="hide">
</header>
<main>
  <section id="vLista">
    <button class="pri grande" id="bReportes">📋 Reportes (enviar o imprimir)</button>
    <div id="alertas"></div>
    <div class="row" style="margin-top:10px">
      <input id="q" type="search" placeholder="Buscar por arete o nombre" aria-label="Buscar">
      <select id="fFinca" aria-label="Finca"></select>
      <button class="pri" id="bNuevo" style="flex:0 0 auto">+ Nuevo animal</button>
    </div>
    <label><input type="checkbox" id="verRet" style="width:auto;min-height:0"> Mostrar retirados</label>
    <div id="lista"></div>
  </section>

  <section id="vReportes" class="hide">
    <button data-volver>← Volver</button>
    <h2>¿Qué reporte quiere?</h2>
    <button class="grande" data-rep="inventario">🐄 Animales por finca</button>
    <button class="grande" data-rep="partos">🍼 Próximos partos y secados</button>
    <button class="grande" data-rep="salidas">📤 Salidas del mes (ventas, muertes, bajas)</button>
    <p class="mut">El reporte de un solo animal está dentro de la ficha de cada animal.</p>
  </section>

  <section id="vReporte" class="hide">
    <div class="noprint">
      <button data-volver>← Volver</button>
      <div id="mesBox" class="hide"><label>Mes</label><input type="month" id="mes"></div>
      <button class="pri grande" id="bWhats">📲 Enviar como foto (WhatsApp)</button>
      <button class="grande" id="bPdf">🖨️ Guardar PDF / Imprimir</button>
    </div>
    <div id="reporte" class="card"></div>
  </section>

  <section id="vAnimal" class="hide">
    <button id="bVolver">← Volver</button>
    <button class="grande" id="bFicha">📋 Reporte de este animal</button>
    <form id="fAnimal" class="card">
      <h2 id="tAnimal">Nuevo animal</h2>
      <div class="row">
        <div><label>Arete *</label><input name="arete" required></div>
        <div><label>Nombre</label><input name="nombre"></div>
      </div>
      <div class="row">
        <div><label>Tipo</label><select name="tipo"><option value="leche">Leche</option><option value="carne">Carne</option></select></div>
        <div><label>Fecha de nacimiento</label><input name="nac" type="date"></div>
      </div>
      <div class="row">
        <div><label>Finca / zona</label><input name="finca" list="listaFincas"><datalist id="listaFincas"></datalist></div>
        <div><label>Sexo</label><select name="sexo"><option value="H">Hembra</option><option value="M">Macho</option></select></div>
      </div>
      <div class="row">
        <div><label>Raza</label><input name="raza"></div>
        <div><label>Categoría</label><select name="categoria"><option value="">—</option><option>Vaca</option><option>Novilla / vaquilla</option><option>Ternera</option><option>Ternero</option><option>Novillo</option><option>Toro</option></select></div>
      </div>
      <label>Notas</label><textarea name="notas" rows="2"></textarea>
      <p><button class="pri">Guardar animal</button></p>
    </form>
    <div id="zonaEventos" class="hide">
      <form id="fEvento" class="card">
        <h2>Añadir evento</h2>
        <div class="row">
          <div><label>Evento</label><select name="tipo" id="selEv"></select></div>
          <div><label>Fecha</label><input name="fecha" type="date" required></div>
        </div>
        <div id="motivoBox" class="hide"><label>Motivo del retiro</label>
          <select name="motivo"><option>Venta</option><option>Muerte</option><option>Baja (desecho)</option></select></div>
        <label>Nota</label><input name="nota" placeholder="Toro, semen, cría, comprador…">
        <p><button class="pri">Añadir evento</button></p>
      </form>
      <div class="card"><h2>Historial</h2><div id="resumen" class="mut"></div><ul id="hist"></ul></div>
    </div>
  </section>
</main>
<script>
const KEY = 'ganado.v1';
const EVENTOS = {celo:'Celo (ciclo)', monta:'Monta / inseminación', prenez:'Preñez confirmada', parto:'Parto', aborto:'Aborto / vacía', destete:'Destete', secado:'Secado', retiro:'Retiro (baja/venta/muerte)'};
const CAMPOS = ['arete', 'nombre', 'tipo', 'nac', 'finca', 'sexo', 'raza', 'categoria', 'notas'];
const GESTACION = 283, SECADO_ANTES = 60;
let db = cargar(), actual = null;

function cargar(){ try { return JSON.parse(localStorage.getItem(KEY)) || {animales:{}} } catch(e){ alert('No se pudieron leer los datos guardados. Importe un respaldo.'); return {animales:{}} } }
function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(db)) } catch(e){ alert('¡No se pudo guardar! Exporte un respaldo ahora. ' + e.message) } }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const hoy = () => new Date().toISOString().slice(0,10);
const sumarDias = (f, n) => { const d = new Date(f + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10) };
const diasHasta = f => Math.round((new Date(f + 'T12:00:00Z') - new Date(hoy() + 'T12:00:00Z')) / 864e5);
const fmt = f => f ? new Date(f + 'T12:00:00Z').toLocaleDateString('es', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'}) : '';
const ordenados = a => [...a.eventos].sort((x, y) => x.fecha.localeCompare(y.fecha) || x.id.localeCompare(y.id));
const retiro = a => a.eventos.find(e => e.tipo === 'retiro');

// Gestación abierta: última monta/preñez sin parto ni aborto posterior. Fecha base = la monta más reciente antes de esa preñez.
function prenezAbierta(a){
  let base = null;
  for (const e of ordenados(a)) {
    if (e.tipo === 'monta') base = e.fecha;
    else if (e.tipo === 'prenez' && !base) base = e.fecha;
    else if (e.tipo === 'parto' || e.tipo === 'aborto') base = null;
  }
  if (!base) return null;
  const parto = sumarDias(base, GESTACION);
  return {parto, secado: a.tipo === 'leche' ? sumarDias(parto, -SECADO_ANTES) : null};
}

function alertas(){
  const out = [];
  for (const a of Object.values(db.animales)) {
    if (retiro(a)) continue;
    const p = prenezAbierta(a); if (!p) continue;
    const yaSeco = a.eventos.some(e => e.tipo === 'secado' && e.fecha >= sumarDias(p.parto, -GESTACION));
    if (p.secado && !yaSeco) out.push({a, que:'Secar', f:p.secado});
    out.push({a, que:'Parto probable', f:p.parto});
  }
  return out.filter(x => diasHasta(x.f) <= 30).sort((x, y) => x.f.localeCompare(y.f));
}

function avisoRespaldo(){
  if (!Object.keys(db.animales).length) return '';
  let ult = null; try { ult = localStorage.getItem(KEY + '.respaldo') } catch(e) {}
  const d = ult ? -diasHasta(ult) : null;
  if (d !== null && d < 7) return '';
  return `<div class="card warn">💾 ${d === null ? 'Aún no ha exportado ningún respaldo.' : `Último respaldo: hace ${d} días.`} Pulse “Exportar respaldo” para no perder datos.</div>`;
}

function pintarLista(){
  const al = alertas();
  $('#alertas').innerHTML = avisoRespaldo() + (al.length ? `<div class="card"><h2>⚠️ Próximos 30 días</h2><ul>${al.map(x => {
    const d = diasHasta(x.f);
    return `<li class="ev item" data-arete="${esc(x.a.arete)}"><span><b>${esc(x.que)}</b> · ${esc(x.a.arete)} ${esc(x.a.nombre)}</span><span class="${d < 0 ? 'bad' : 'warn'}">${fmt(x.f)} (${d < 0 ? 'hace ' + -d : 'en ' + d} días)</span></li>`
  }).join('')}</ul></div>` : '');
  const fincas = [...new Set(Object.values(db.animales).map(a => a.finca).filter(Boolean))].sort();
  const sel = $('#fFinca'), elegida = sel.value;
  sel.innerHTML = '<option value="">Todas las fincas</option>' + fincas.map(f => `<option${f === elegida ? ' selected' : ''}>${esc(f)}</option>`).join('');
  $('#listaFincas').innerHTML = fincas.map(f => `<option value="${esc(f)}">`).join('');
  const q = $('#q').value.trim().toLowerCase(), verRet = $('#verRet').checked, finca = sel.value;
  const lista = Object.values(db.animales)
    .filter(a => (verRet || !retiro(a)) && (!finca || a.finca === finca) &&(!q || a.arete.toLowerCase().includes(q) || (a.nombre || '').toLowerCase().includes(q)))
    .sort((x, y) => x.arete.localeCompare(y.arete, 'es', {numeric:true}));
  $('#lista').innerHTML = lista.map(a => {
    const r = retiro(a), p = prenezAbierta(a);
    return `<div class="card item" data-arete="${esc(a.arete)}"><span><b>${esc(a.arete)}</b> ${esc(a.nombre)}<br><span class="mut">${[a.finca, a.categoria, a.raza, a.tipo === 'leche' ? 'Leche' : 'Carne'].filter(Boolean).map(esc).join(' · ')} · ${a.eventos.length} eventos</span></span>
      <span>${r ? `<span class="tag bad">${esc(r.motivo)}</span>` : p ? `<span class="tag">Preñada · parto ${fmt(p.parto)}</span>` : ''}</span></div>`
  }).join('') || `<p class="mut">${Object.keys(db.animales).length ? 'Sin resultados.' : 'Aún no hay animales. Pulse “+ Nuevo animal”.'}</p>`;
}

function abrir(arete){
  actual = arete ? db.animales[arete] : null;
  const f = $('#fAnimal');
  f.reset();
  if (actual) for (const k of CAMPOS) f[k].value = actual[k] || '';
  $('#tAnimal').textContent = actual ? 'Animal ' + actual.arete : 'Nuevo animal';
  $('#zonaEventos').classList.toggle('hide', !actual);
  $('#bFicha').classList.toggle('hide', !actual);
  ver('vAnimal');
  if (actual) pintarAnimal();
}
function volver(){ actual = null; ver('vLista'); pintarLista() }
let vista = 'vLista', anterior = 'vLista';
function ver(id){
  if (id !== vista) anterior = vista;
  for (const s of document.querySelectorAll('main > section')) s.classList.toggle('hide', s.id !== id);
  vista = id; scrollTo(0, 0);
}

function pintarAnimal(){
  const a = actual, ev = ordenados(a).reverse(), c = t => a.eventos.filter(e => e.tipo === t).length;
  const p = prenezAbierta(a), r = retiro(a);
  $('#resumen').innerHTML = `Preñeces: ${c('prenez')} · Partos: ${c('parto')} · Celos: ${c('celo')} · Destetes: ${c('destete')} · Secados: ${c('secado')}` +
    (p ? `<br><b class="warn">Parto probable: ${fmt(p.parto)}${p.secado ? ' · Secar el ' + fmt(p.secado) : ''}</b>` : '') +
    (r ? `<br><b class="bad">Retirado: ${esc(r.motivo)} el ${fmt(r.fecha)}</b>` : '');
  $('#hist').innerHTML = ev.map(e => `<li class="ev"><span><b>${esc(EVENTOS[e.tipo])}</b>${e.motivo ? ' · ' + esc(e.motivo) : ''}<br><span class="mut">${fmt(e.fecha)}${e.nota ? ' · ' + esc(e.nota) : ''}</span></span>
    <button data-borrar="${esc(e.id)}" aria-label="Borrar evento" style="flex:0 0 auto">✕</button></li>`).join('') || '<li class="mut">Sin eventos todavía.</li>';
}

$('#selEv').innerHTML = Object.entries(EVENTOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
$('#selEv').onchange = e => $('#motivoBox').classList.toggle('hide', e.target.value !== 'retiro');
$('#q').oninput = $('#verRet').onchange = $('#fFinca').onchange = pintarLista;
$('#bNuevo').onclick = () => abrir(null);
$('#bVolver').onclick = volver;
document.addEventListener('click', e => {
  const it = e.target.closest('[data-arete]'); if (it) return abrir(it.dataset.arete);
  const b = e.target.closest('[data-borrar]');
  if (e.target.closest('[data-volver]')) return vista === 'vReporte' ? ver(anterior) : volver();
  const rep = e.target.closest('[data-rep]'); if (rep) return mostrarReporte(rep.dataset.rep);
  if (b && confirm('¿Seguro que quiere borrar este evento?\n\nNo se puede deshacer.')) { actual.eventos = actual.eventos.filter(x => x.id !== b.dataset.borrar); guardar(); pintarAnimal() }
});

$('#fAnimal').onsubmit = e => {
  e.preventDefault();
  const f = e.target, arete = f.arete.value.trim();
  if (!arete) return;
  if (arete !== actual?.arete && db.animales[arete]) return alert('Ya existe un animal con el arete ' + arete);
  const a = actual || {eventos: []};
  if (actual && arete !== actual.arete) delete db.animales[actual.arete];
  for (const k of CAMPOS) a[k] = f[k].value.trim();
  db.animales[arete] = a; guardar(); abrir(arete);
};
$('#fEvento').onsubmit = e => {
  e.preventDefault();
  const f = e.target, ev = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tipo: f.tipo.value, fecha: f.fecha.value, nota: f.nota.value.trim()};
  if (ev.tipo === 'retiro') {
    if (retiro(actual)) return alert('Este animal ya está retirado.');
    ev.motivo = f.motivo.value;
    if (!confirm(`¿Seguro que quiere retirar al animal ${actual.arete} por ${ev.motivo}?\n\nYa no aparecerá en la lista.`)) return;
  }
  actual.eventos.push(ev); guardar(); f.nota.value = ''; pintarAnimal();
};

// ---- Reportes: cada uno devuelve {titulo, sub, secciones:[{titulo, nota, cols, filas}]}, que se pinta en HTML y en imagen.
const edad = nac => { if (!nac) return ''; const m = Math.floor(-diasHasta(nac) / 30.44); return m < 12 ? m + ' meses' : Math.floor(m / 12) + (m < 24 ? ' año' : ' años') + (m % 12 ? ' ' + m % 12 + ' m' : '') };
const nombreA = a => a.arete + (a.nombre ? ' ' + a.nombre : '');
const activos = () => Object.values(db.animales).filter(a => !retiro(a)).sort((x, y) => x.arete.localeCompare(y.arete, 'es', {numeric:true}));
const contar = lista => Object.entries(lista.reduce((c, a) => (c[a.categoria || 'Sin categoría'] = (c[a.categoria || 'Sin categoría'] || 0) + 1, c), {})).map(([k, n]) => `${n} ${k}`).join(' · ');

const REPORTES = {
  inventario(){
    const porFinca = {};
    for (const a of activos()) (porFinca[a.finca || 'Sin finca'] ??= []).push(a);
    const total = Object.values(porFinca).flat().length;
    return {titulo: 'Animales por finca', sub: `${total} animales activos · ${fmt(hoy())}`,
      secciones: Object.keys(porFinca).sort().map(f => ({titulo: `${f} — ${porFinca[f].length} animales`, nota: contar(porFinca[f]),
        cols: ['Arete', 'Categoría', 'Raza', 'Edad'], filas: porFinca[f].map(a => [nombreA(a), a.categoria, a.raza, edad(a.nac)])}))};
  },
  partos(){
    const filas = activos().map(a => ({a, p: prenezAbierta(a)})).filter(x => x.p).sort((x, y) => x.p.parto.localeCompare(y.p.parto))
      .map(({a, p}) => { const d = diasHasta(p.parto); return [nombreA(a), a.finca, fmt(p.parto), p.secado ? fmt(p.secado) : '—', d < 0 ? `Pasó hace ${-d} días` : `Faltan ${d} días`] });
    return {titulo: 'Próximos partos y secados', sub: `${filas.length} vacas preñadas · ${fmt(hoy())}`,
      secciones: [{titulo: '', nota: filas.length ? 'Parto = monta + 283 días. Secar 60 días antes (solo leche).' : 'No hay vacas preñadas anotadas.', cols: ['Animal', 'Finca', 'Parto', 'Secar', 'Cuándo'], filas}]};
  },
  salidas(){
    const mes = $('#mes').value || hoy().slice(0, 7);
    const sal = Object.values(db.animales).map(a => ({a, r: retiro(a)})).filter(x => x.r && x.r.fecha.startsWith(mes)).sort((x, y) => x.r.fecha.localeCompare(y.r.fecha));
    const nombreMes = new Date(mes + '-15T12:00:00Z').toLocaleDateString('es', {month: 'long', year: 'numeric', timeZone: 'UTC'});
    const cuenta = ['Venta', 'Muerte', 'Baja (desecho)'].map(m => `${sal.filter(x => x.r.motivo === m).length} ${m}`).join(' · ');
    return {titulo: 'Salidas de ' + nombreMes, sub: `${sal.length} animales salieron`,
      secciones: [{titulo: '', nota: sal.length ? cuenta : 'Ningún animal salió este mes.', cols: ['Fecha', 'Animal', 'Finca', 'Motivo', 'Nota'],
        filas: sal.map(({a, r}) => [fmt(r.fecha), nombreA(a), a.finca, r.motivo, r.nota])}]};
  },
  ficha(){
    const a = actual, p = prenezAbierta(a), r = retiro(a);
    const datos = [['Arete', a.arete], ['Nombre', a.nombre], ['Finca', a.finca], ['Tipo', a.tipo === 'leche' ? 'Leche' : 'Carne'], ['Sexo', a.sexo === 'M' ? 'Macho' : 'Hembra'],
      ['Raza', a.raza], ['Categoría', a.categoria], ['Nacimiento', a.nac ? `${fmt(a.nac)} (${edad(a.nac)})` : ''],
      ['Estado', r ? `Retirado: ${r.motivo} el ${fmt(r.fecha)}` : p ? `Preñada · parto ${fmt(p.parto)}` + (p.secado ? ` · secar ${fmt(p.secado)}` : '') : 'Activo'], ['Notas', a.notas]].filter(x => x[1]);
    return {titulo: 'Ficha del animal ' + nombreA(a), sub: fmt(hoy()), secciones: [
      {titulo: 'Datos', cols: [], filas: datos},
      {titulo: 'Historial', nota: a.eventos.length ? '' : 'Sin eventos.', cols: ['Fecha', 'Evento', 'Nota'],
        filas: ordenados(a).reverse().map(e => [fmt(e.fecha), EVENTOS[e.tipo] + (e.motivo ? ' · ' + e.motivo : ''), e.nota])}]};
  },
};

let repActual = null, repTipo = null;
function mostrarReporte(tipo){
  repTipo = tipo; repActual = REPORTES[tipo]();
  $('#mesBox').classList.toggle('hide', tipo !== 'salidas');
  $('#reporte').innerHTML = `<h2>${esc(repActual.titulo)}</h2><p class="mut">${esc(repActual.sub)}</p>` + repActual.secciones.map(s =>
    (s.titulo ? `<h3>${esc(s.titulo)}</h3>` : '') + (s.nota ? `<p>${esc(s.nota)}</p>` : '') + (s.filas.length ? `<table>` +
    (s.cols.length ? `<tr>${s.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>` : '') +
    s.filas.map(f => `<tr>${f.map((c, i) => `<td>${!s.cols.length && i === 0 ? '<b>' + esc(c) + '</b>' : esc(c)}</td>`).join('')}</tr>`).join('') + `</table>` : '')).join('');
  ver('vReporte');
}

// Dibuja el reporte como imagen (para WhatsApp). Columnas con ancho según su texto; la última se recorta con "…".
function reporteAImagen(r){
  const W = 1080, P = 48, LH = 46, c = document.createElement('canvas'), x = c.getContext('2d');
  const F = (peso, tam) => `${peso} ${tam}px system-ui, sans-serif`;
  const corta = (t, max) => { t = String(t ?? ''); if (x.measureText(t).width <= max) return t; while (t && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…' };
  const pasos = [];  // [y, fn] — primero se mide la altura, luego se dibuja
  let y = P;
  pasos.push(() => { x.fillStyle = '#2f6f3e'; x.fillRect(0, 0, W, 150); x.fillStyle = '#fff'; x.font = F(700, 50); x.fillText(corta('🐄 ' + r.titulo, W - 2 * P), P, 80); x.font = F(400, 30); x.fillText(r.sub, P, 125) });
  y = 200;
  for (const s of r.secciones) {
    if (s.titulo) { const yy = y; pasos.push(() => { x.fillStyle = '#2f6f3e'; x.font = F(700, 38); x.fillText(corta(s.titulo, W - 2 * P), P, yy) }); y += 56 }
    if (s.nota) { const yy = y; pasos.push(() => { x.fillStyle = '#333'; x.font = F(400, 30); x.fillText(corta(s.nota, W - 2 * P), P, yy) }); y += 50 }
    if (!s.filas.length) continue;
    x.font = F(400, 30);
    const filas = s.cols.length ? [s.cols, ...s.filas] : s.filas;
    const n = filas[0].length, anchos = Array.from({length: n}, (_, i) => Math.max(...filas.map(f => x.measureText(String(f[i] ?? '')).width)) + 28);
    let sobra = W - 2 * P - anchos.reduce((a, b) => a + b, 0);
    for (let i = n - 1; sobra < 0 && i > 0; i--) { const quita = Math.min(-sobra, anchos[i] - 120); if (quita > 0) { anchos[i] -= quita; sobra += quita } }
    filas.forEach((f, k) => {
      const yy = y, cab = s.cols.length && k === 0;
      pasos.push(() => {
        if (k % 2 === (s.cols.length ? 1 : 0)) { x.fillStyle = '#eef6ef'; x.fillRect(P - 10, yy - 34, W - 2 * P + 20, LH) }
        let xx = P;
        f.forEach((t, i) => { x.fillStyle = '#111'; x.font = F(cab || (!s.cols.length && i === 0) ? 700 : 400, 30); x.fillText(corta(t, anchos[i] - 20), xx, yy); xx += anchos[i] });
      });
      y += LH;
    });
    y += 30;
  }
  c.width = W; c.height = y + 20;
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, c.height);
  pasos.forEach(p => p());
  return c;
}

};
// Fusiona sin borrar: animales nuevos se agregan, eventos se unen por id. Los datos locales del animal ganan.
// shortcut: un evento borrado reaparece si otro respaldo aún lo tiene; añadir "borrados" si estorba.
function fusionar(dst, src){
  if (!src || typeof src.animales !== 'object') throw new Error('no es un respaldo de ganado');
  const n = {animales: 0, eventos: 0};
  for (const [k, a] of Object.entries(src.animales)) {
    if (!a || !Array.isArray(a.eventos) || typeof a.arete !== 'string') throw new Error('animal mal formado: ' + k);
    const loc = dst.animales[a.arete];
    if (!loc) { dst.animales[a.arete] = a; n.animales++; n.eventos += a.eventos.length; continue }
    const ids = new Set(loc.eventos.map(x => x.id));
    for (const ev of a.eventos) if (!ids.has(ev.id)) { loc.eventos.push(ev); n.eventos++ }
  }
  return n;
}
